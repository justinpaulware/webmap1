<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MHREDC / Transformational Regional Initiatives</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="styles.js"></script>
<script src="layers.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
}

/* MAP */
#map {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
}

/* SIDEBAR */
#sidebar {
  position: absolute;
  left: 16px;
  top: 16px;
  bottom: 16px;

  width: 300px;

  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);

  overflow: hidden;
  z-index: 10;

  display: flex;
  flex-direction: column;
}

/* HEADER */
#header {
  padding: 14px 16px 10px 16px;
  border-bottom: 1px solid #eee;
}

#project-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
  color: #111827;
}

#header h2 {
  margin: 0;
  font-size: 14px;
  color: #374151;
}

/* LIST */
#layer-list {
  padding: 12px;
  overflow-y: auto;
  flex: 1;
}

/* GROUP */
.group-title {
  margin-top: 14px;
  margin-bottom: 6px;
  font-size: 10px;
  text-transform: uppercase;
  color: #6b7280;
}

/* ROW */
.layer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px;
  border-radius: 8px;
}

.layer-row:hover {
  background: #f9fafb;
}

.layer-left {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 13px;
}

.zoom-btn {
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 4px 10px;
  background: white;
  cursor: pointer;
}

.zoom-btn:hover {
  background: #f3f4f6;
}
</style>
</head>

<body>

<div id="sidebar">
  <div id="header">
    <div id="project-title">
      MHREDC / Transformational Regional Initiatives
    </div>
    <h2>Layers</h2>
  </div>
  <div id="layer-list"></div>
</div>

<div id="map"></div>

<script>

/* =========================
   MAP
========================= */

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/positron",
  center: [-73.9209, 41.2901],
  zoom: 8
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

/* =========================
   STATE
========================= */

const STATE = {
  featuresByLayer: {},
  layerDefs: {},
  loadedPromises: []
};

/* =========================
   BOOTSTRAP
========================= */

map.on("load", async () => {

  buildSidebar();

  const layers = window.LAYERS || [];

  layers.forEach(l => STATE.layerDefs[l.id] = l);

  STATE.loadedPromises = layers.map(loadLayer);

  await Promise.all(STATE.loadedPromises);

  runInitialView(layers);

});

/* =========================
   LOADERS
========================= */

function loadLayer(layer) {
  if (layer.type === "geojson") return loadGeoJSON(layer);
  if (layer.type === "rest") return loadREST(layer);
  if (layer.type === "sheet") return loadSheet(layer);
}

async function loadGeoJSON(layer) {
  const r = await fetch(layer.url);
  const data = await r.json();
  register(layer.id, data);
}

async function loadREST(layer) {
  const r = await fetch(layer.url);
  const data = await r.json();
  register(layer.id, data);
}

function loadSheet(layer) {
  return new Promise((resolve, reject) => {

    Papa.parse(layer.url, {
      download: true,
      header: true,

      complete: res => {
        const geojson = {
          type: "FeatureCollection",
          features: res.data
            .filter(d => d[layer.latField] && d[layer.lngField])
            .map(d => ({
              type: "Feature",
              geometry: {
                type: "Point",
                coordinates: [
                  parseFloat(d[layer.lngField]),
                  parseFloat(d[layer.latField])
                ]
              },
              properties: d
            }))
        };

        register(layer.id, geojson);
        resolve();
      },

      error: reject
    });

  });
}

/* =========================
   REGISTER
========================= */

function register(layerId, geojson) {

  const features = geojson?.features || [];
  STATE.featuresByLayer[layerId] = features;

  addLayer(layerId, geojson);
}

/* =========================
   RENDER (STYLE SYSTEM)
========================= */

function addLayer(layerId, data) {

  const layerDef = STATE.layerDefs[layerId];
  const style = window.STYLES?.[layerDef?.style];

  if (!map.getSource(layerId)) {
    map.addSource(layerId, { type: "geojson", data });
  }

  if (!style) return;

  map.addLayer({
    id: layerId,
    type: style.type,
    source: layerId,
    paint: style.paint
  });
}

/* =========================
   EXTENT
========================= */

function fitExtent(layerIds) {

  const coords = [];

  layerIds.forEach(id => {
    (STATE.featuresByLayer[id] || []).forEach(f => collect(f.geometry, coords));
  });

  if (!coords.length) return;

  let [minX, minY] = coords[0];
  let [maxX, maxY] = coords[0];

  coords.forEach(c => {
    minX = Math.min(minX, c[0]);
    minY = Math.min(minY, c[1]);
    maxX = Math.max(maxX, c[0]);
    maxY = Math.max(maxY, c[1]);
  });

  map.fitBounds([[minX, minY], [maxX, maxY]], { padding: 50 });
}

/* =========================
   INITIAL VIEW
========================= */

function runInitialView(layers) {
  const targets = layers.filter(l => l.initialView).map(l => l.id);
  if (targets.length) fitExtent(targets);
}

/* =========================
   COORDS
========================= */

function collect(g, out) {
  if (!g) return;

  if (g.type === "Point") out.push(g.coordinates);
  else if (g.type.includes("Line")) g.coordinates.forEach(c => out.push(c));
  else if (g.type.includes("Polygon")) g.coordinates.flat(2).forEach(c => out.push(c));
}

/* =========================
   SIDEBAR
========================= */

function buildSidebar() {

  const el = document.getElementById("layer-list");
  const groups = {};

  (window.LAYERS || []).forEach(l => {
    (groups[l.group] ||= []).push(l);
  });

  Object.entries(groups).forEach(([group, layers]) => {

    const title = document.createElement("div");
    title.className = "group-title";
    title.innerText = group;
    el.appendChild(title);

    layers.forEach(layer => {

      const row = document.createElement("div");
      row.className = "layer-row";

      row.innerHTML = `
        <div class="layer-left">
          <input type="checkbox" checked id="t-${layer.id}">
          <span>${layer.name}</span>
        </div>
        <button class="zoom-btn" id="z-${layer.id}">⤢</button>
      `;

      el.appendChild(row);

      row.querySelector(`#t-${layer.id}`)
        .addEventListener("change", e => {
          if (!map.getLayer(layer.id)) return;
          map.setLayoutProperty(layer.id, "visibility",
            e.target.checked ? "visible" : "none");
        });

      row.querySelector(`#z-${layer.id}`)
        .addEventListener("click", () => {
          const f = STATE.featuresByLayer[layer.id];
          if (!f?.length) return;

          const coords = [];
          f.forEach(d => collect(d.geometry, coords));

          let [minX, minY] = coords[0];
          let [maxX, maxY] = coords[0];

          coords.forEach(c => {
            minX = Math.min(minX, c[0]);
            minY = Math.min(minY, c[1]);
            maxX = Math.max(maxX, c[0]);
            maxY = Math.max(maxY, c[1]);
          });

          map.fitBounds([[minX, minY], [maxX, maxY]], { padding: 40 });
        });

    });
  });
}

</script>

</body>
</html>
