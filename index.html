<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MHREDC / Transformational Regional Initiatives</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="layers.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
}

/* =========================
   MAP
========================= */
#map {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
}

/* =========================
   FLOATING SIDEBAR
========================= */
#sidebar {
  position: absolute;
  left: 16px;
  top: 16px;
  bottom: 16px;

  width: 300px;

  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);

  overflow: hidden;
  z-index: 10;

  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */
#header {
  padding: 14px 16px 10px 16px;
  border-bottom: 1px solid #eee;
  background: #fff;
}

#project-title {
  font-size: 13px;
  font-weight: 600;
  color: #111827;
  margin-bottom: 6px;
  letter-spacing: 0.2px;
}

#header h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  color: #374151;
}

/* =========================
   LIST CONTAINER
========================= */
#layer-list {
  padding: 10px 10px 16px 10px;
  overflow-y: auto;
  flex: 1;
}

/* =========================
   GROUPS
========================= */
.group-title {
  margin-top: 14px;
  margin-bottom: 6px;
  padding: 6px 6px;

  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;

  color: #6b7280;
}

/* =========================
   ROWS
========================= */
.layer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 8px 8px;
  margin-bottom: 4px;

  border-radius: 8px;
}

.layer-row:hover {
  background: #f9fafb;
}

.layer-left {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #111827;
}

/* =========================
   ZOOM BUTTON
========================= */
.zoom-btn {
  border: 1px solid #e5e7eb;
  background: #fff;

  border-radius: 8px;
  padding: 4px 10px;

  cursor: pointer;
  transition: all 0.15s ease;
}

.zoom-btn:hover {
  background: #f3f4f6;
  border-color: #d1d5db;
}
</style>
</head>

<body>

<div id="sidebar">
  <div id="header">
    <div id="project-title">
      MHREDC / Transformational Regional Initiatives
    </div>
    <h2>Layers</h2>
  </div>
  <div id="layer-list"></div>
</div>

<div id="map"></div>

<script>

/* =========================
   MAP INIT
========================= */

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/positron",
  center: [-73.9209, 41.2901],
  zoom: 8
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

/* =========================
   STATE
========================= */

const STATE = {
  featuresByLayer: {},
  layerDefs: {},
  loadedPromises: [],
  mapReady: false
};

/* =========================
   BOOTSTRAP
========================= */

map.on("load", async () => {

  buildSidebar();

  const layers = window.LAYERS || [];

  layers.forEach(l => STATE.layerDefs[l.id] = l);

  STATE.loadedPromises = layers.map(loadLayer);

  await Promise.all(STATE.loadedPromises);

  STATE.mapReady = true;

  runInitialView(layers);

});

/* =========================
   LOADERS
========================= */

function loadLayer(layer) {
  if (layer.type === "geojson") return loadGeoJSON(layer);
  if (layer.type === "rest") return loadREST(layer);
  if (layer.type === "sheet") return loadSheet(layer);
}

async function loadGeoJSON(layer) {
  const res = await fetch(layer.url);
  const data = await res.json();
  registerFeatures(layer.id, data);
}

async function loadREST(layer) {
  const res = await fetch(layer.url);
  const data = await res.json();
  registerFeatures(layer.id, data);
}

function loadSheet(layer) {
  return new Promise((resolve, reject) => {

    Papa.parse(layer.url, {
      download: true,
      header: true,

      complete: function(results) {

        const geojson = {
          type: "FeatureCollection",
          features: results.data
            .filter(r => r[layer.latField] && r[layer.lngField])
            .map(r => ({
              type: "Feature",
              geometry: {
                type: "Point",
                coordinates: [
                  parseFloat(r[layer.lngField]),
                  parseFloat(r[layer.latField])
                ]
              },
              properties: r
            }))
        };

        registerFeatures(layer.id, geojson);
        resolve();

      },

      error: reject
    });

  });
}

/* =========================
   FEATURE REGISTRY
========================= */

function registerFeatures(layerId, geojson) {
  const features = geojson?.features || [];
  STATE.featuresByLayer[layerId] = features;
  addLayerToMap(layerId, geojson);
}

/* =========================
   MAP RENDERING
========================= */

function addLayerToMap(layerId, data) {

  if (!map.getSource(layerId)) {
    map.addSource(layerId, {
      type: "geojson",
      data
    });
  }

  const geomType = detectGeometry(data);

  if (geomType === "point") {
    map.addLayer({
      id: layerId,
      type: "circle",
      source: layerId,
      paint: {
        "circle-radius": 6,
        "circle-color": "#2563eb",
        "circle-stroke-width": 1,
        "circle-stroke-color": "#fff"
      }
    });
  }

  if (geomType === "line") {
    map.addLayer({
      id: layerId,
      type: "line",
      source: layerId,
      paint: {
        "line-color": "#2563eb",
        "line-width": 2
      }
    });
  }

  if (geomType === "polygon") {
    map.addLayer({
      id: layerId,
      type: "fill",
      source: layerId,
      paint: {
        "fill-color": "#f59e0b",
        "fill-opacity": 0.25,
        "fill-outline-color": "#b45309"
      }
    });
  }
}

/* =========================
   GEOMETRY
========================= */

function detectGeometry(data) {
  const f = data.features?.find(d => d.geometry);
  if (!f) return "point";

  const t = f.geometry.type;

  if (t.includes("Point")) return "point";
  if (t.includes("Line")) return "line";
  return "polygon";
}

/* =========================
   EXTENT ENGINE
========================= */

function fitLayerExtent(layerIds, options = {}) {

  const coords = [];

  layerIds.forEach(id => {
    const features = STATE.featuresByLayer[id] || [];
    features.forEach(f => collectCoords(f.geometry, coords));
  });

  if (!coords.length) return;

  let minX = coords[0][0];
  let minY = coords[0][1];
  let maxX = coords[0][0];
  let maxY = coords[0][1];

  coords.forEach(c => {
    minX = Math.min(minX, c[0]);
    minY = Math.min(minY, c[1]);
    maxX = Math.max(maxX, c[0]);
    maxY = Math.max(maxY, c[1]);
  });

  map.fitBounds([[minX, minY], [maxX, maxY]], {
    padding: options.padding || 40
  });
}

/* =========================
   INITIAL VIEW
========================= */

function runInitialView(layers) {

  const startup = layers
    .filter(l => l.initialView || l.presetGroup === "startup")
    .map(l => l.id);

  if (!startup.length) return;

  fitLayerExtent(startup, { padding: 60 });
}

/* =========================
   COORDS
========================= */

function collectCoords(geom, out) {
  if (!geom) return;

  if (geom.type === "Point") out.push(geom.coordinates);

  else if (geom.type === "MultiPoint" || geom.type === "LineString")
    geom.coordinates.forEach(c => out.push(c));

  else if (geom.type === "MultiLineString" || geom.type === "Polygon")
    geom.coordinates.flat().forEach(c => out.push(c));

  else if (geom.type === "MultiPolygon")
    geom.coordinates.flat(2).forEach(c => out.push(c));
}

/* =========================
   SIDEBAR
========================= */

function buildSidebar() {

  const container = document.getElementById("layer-list");
  const groups = {};

  (window.LAYERS || []).forEach(layer => {
    const g = layer.group || "Layers";
    if (!groups[g]) groups[g] = [];
    groups[g].push(layer);
  });

  Object.keys(groups).forEach(group => {

    const title = document.createElement("div");
    title.className = "group-title";
    title.innerText = group;
    container.appendChild(title);

    groups[group].forEach(layer => {

      const row = document.createElement("div");
      row.className = "layer-row";

      row.innerHTML = `
        <div class="layer-left">
          <input type="checkbox" checked id="toggle-${layer.id}">
          <span>${layer.name}</span>
        </div>
        <button class="zoom-btn" id="zoom-${layer.id}">⤢</button>
      `;

      container.appendChild(row);

      /* TOGGLE */
      row.querySelector(`#toggle-${layer.id}`)
        .addEventListener("change", e => {
          if (!map.getLayer(layer.id)) return;
          map.setLayoutProperty(
            layer.id,
            "visibility",
            e.target.checked ? "visible" : "none"
          );
        });

      /* ZOOM */
      row.querySelector(`#zoom-${layer.id}`)
        .addEventListener("click", () => {

          const features = STATE.featuresByLayer[layer.id];
          if (!features?.length) return;

          const coords = [];
          features.forEach(f => collectCoords(f.geometry, coords));

          if (!coords.length) return;

          let minX = coords[0][0], minY = coords[0][1];
          let maxX = coords[0][0], maxY = coords[0][1];

          coords.forEach(c => {
            minX = Math.min(minX, c[0]);
            minY = Math.min(minY, c[1]);
            maxX = Math.max(maxX, c[0]);
            maxY = Math.max(maxY, c[1]);
          });

          map.fitBounds([[minX, minY], [maxX, maxY]], {
            padding: 40
          });

        });

    });
  });
}

</script>

</body>
</html>
