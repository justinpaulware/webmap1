<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MHREDC / Transformational Regional Initiatives</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="layers.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

#sidebar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 280px;
  background: #fff;
  border-right: 1px solid #ddd;
  overflow-y: auto;
  z-index: 2;
}

#header {
  padding: 16px;
  border-bottom: 1px solid #eee;
}

#header h2 {
  margin: 0;
  font-size: 18px;
}

.group-title {
  padding: 10px 12px;
  font-size: 12px;
  text-transform: uppercase;
  color: #666;
  border-top: 1px solid #f0f0f0;
  margin-top: 10px;
}

.layer-list {
  padding: 8px 12px;
}

.layer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
}

.layer-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.zoom-btn {
  border: 1px solid #ccc;
  background: #fff;
  border-radius: 4px;
  padding: 2px 8px;
  cursor: pointer;
}

.zoom-btn:hover {
  background: #f5f5f5;
}

#map {
  position: absolute;
  left: 280px;
  right: 0;
  top: 0;
  bottom: 0;
}
</style>
</head>

<body>

<div id="sidebar">
  <div id="header">
    <h2>Layers</h2>
  </div>
  <div id="layer-list"></div>
</div>

<div id="map"></div>

<script>

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/positron",
  center: [-73.9209, 41.2901],
  zoom: 8
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

/* =========================
   STATE
========================= */

let loadedCount = 0;
let extentLayers = [];

/* =========================
   INIT
========================= */

map.on("load", () => {
  buildSidebar();
  (window.LAYERS || []).forEach(loadLayer);
});

/* =========================
   LOADERS
========================= */

function loadLayer(layer) {
  if (layer.type === "geojson") loadGeoJSON(layer);
  if (layer.type === "rest") loadREST(layer);
  if (layer.type === "sheet") loadSheet(layer);
}

function loadGeoJSON(layer) {
  fetch(layer.url)
    .then(r => r.json())
    .then(data => addLayer(layer, data))
    .catch(err => console.error("Failed:", layer.name, err));
}

function loadREST(layer) {
  fetch(layer.url)
    .then(r => r.json())
    .then(data => addLayer(layer, data))
    .catch(err => console.error("Failed:", layer.name, err));
}

function loadSheet(layer) {
  Papa.parse(layer.url, {
    download: true,
    header: true,

    complete: function(results) {

      const geojson = {
        type: "FeatureCollection",
        features: results.data
          .filter(r => r[layer.latField] && r[layer.lngField])
          .map(r => ({
            type: "Feature",
            geometry: {
              type: "Point",
              coordinates: [
                parseFloat(r[layer.lngField]),
                parseFloat(r[layer.latField])
              ]
            },
            properties: r
          }))
      };

      addLayer(layer, geojson);
    },

    error: err => console.error("Failed:", layer.name, err)
  });
}

/* =========================
   ADD LAYER
========================= */

function addLayer(layer, data) {

  map.addSource(layer.id, {
    type: "geojson",
    data: data
  });

  const geomType = detectGeometry(data);

  if (geomType === "point") {
    map.addLayer({
      id: layer.id,
      type: "circle",
      source: layer.id,
      paint: {
        "circle-radius": 6,
        "circle-color": "#2563eb",
        "circle-stroke-width": 1,
        "circle-stroke-color": "#fff"
      }
    });
  }

  if (geomType === "line") {
    map.addLayer({
      id: layer.id,
      type: "line",
      source: layer.id,
      paint: {
        "line-color": "#2563eb",
        "line-width": 2
      }
    });
  }

  if (geomType === "polygon") {
    map.addLayer({
      id: layer.id,
      type: "fill",
      source: layer.id,
      paint: {
        "fill-color": "#f59e0b",
        "fill-opacity": 0.25,
        "fill-outline-color": "#b45309"
      }
    });
  }

  /* =========================
     EXTENT LOGIC
  ========================= */

  if (layer.initialExtentLayer) {
    extentLayers.push(data);
  }

  loadedCount++;
  checkAllLoaded();
}

/* =========================
   DETECT GEOMETRY
========================= */

function detectGeometry(data) {
  const f = data.features?.find(d => d.geometry);
  if (!f) return "point";

  const t = f.geometry.type;

  if (t.includes("Point")) return "point";
  if (t.includes("Line")) return "line";
  return "polygon";
}

/* =========================
   AUTO FIT EXTENT
========================= */

function checkAllLoaded() {

  if (loadedCount !== (window.LAYERS || []).length) return;
  if (!extentLayers.length) return;

  const coords = [];

  extentLayers.forEach(fc => {
    fc.features.forEach(f => {
      collectCoords(f.geometry, coords);
    });
  });

  let minX, minY, maxX, maxY;

  coords.forEach((c, i) => {
    if (i === 0) {
      minX = maxX = c[0];
      minY = maxY = c[1];
    } else {
      minX = Math.min(minX, c[0]);
      minY = Math.min(minY, c[1]);
      maxX = Math.max(maxX, c[0]);
      maxY = Math.max(maxY, c[1]);
    }
  });

  map.fitBounds([[minX, minY], [maxX, maxY]], {
    padding: 40
  });
}

/* =========================
   COORDS UTILITY
========================= */

function collectCoords(geom, out) {
  if (!geom) return;

  if (geom.type === "Point") out.push(geom.coordinates);

  else if (geom.type === "MultiPoint" || geom.type === "LineString")
    geom.coordinates.forEach(c => out.push(c));

  else if (geom.type === "MultiLineString" || geom.type === "Polygon")
    geom.coordinates.flat().forEach(c => out.push(c));

  else if (geom.type === "MultiPolygon")
    geom.coordinates.flat(2).forEach(c => out.push(c));
}

/* =========================
   SIDEBAR
========================= */

function buildSidebar() {
  const container = document.getElementById("layer-list");

  const groups = {};

  (window.LAYERS || []).forEach(layer => {
    const g = layer.group || "Layers";
    if (!groups[g]) groups[g] = [];
    groups[g].push(layer);
  });

  Object.keys(groups).forEach(group => {

    const title = document.createElement("div");
    title.className = "group-title";
    title.innerText = group;
    container.appendChild(title);

    groups[group].forEach(layer => {

      const row = document.createElement("div");
      row.className = "layer-row";

      row.innerHTML = `
        <div class="layer-left">
          <input type="checkbox" checked id="toggle-${layer.id}">
          <span>${layer.name}</span>
        </div>
        <button class="zoom-btn" id="zoom-${layer.id}">⤢</button>
      `;

      container.appendChild(row);

      /* toggle */
      row.querySelector(`#toggle-${layer.id}`)
        .addEventListener("change", e => {
          if (!map.getLayer(layer.id)) return;
          map.setLayoutProperty(
            layer.id,
            "visibility",
            e.target.checked ? "visible" : "none"
          );
        });

      /* zoom */
      row.querySelector(`#zoom-${layer.id}`)
        .addEventListener("click", () => {
          const src = map.getSource(layer.id);
          if (!src?._data?.features) return;

          const coords = [];
          src._data.features.forEach(f => {
            collectCoords(f.geometry, coords);
          });

          if (!coords.length) return;

          let minX = coords[0][0], minY = coords[0][1];
          let maxX = coords[0][0], maxY = coords[0][1];

          coords.forEach(c => {
            minX = Math.min(minX, c[0]);
            minY = Math.min(minY, c[1]);
            maxX = Math.max(maxX, c[0]);
            maxY = Math.max(maxY, c[1]);
          });

          map.fitBounds([[minX, minY], [maxX, maxY]], {
            padding: 40
          });
        });

    });
  });
}

</script>

</body>
</html>
